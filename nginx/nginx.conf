# =============================================================================
# Hermes Platform Nginx 反向代理
#
# 职责：
#   1. 统一入口 :80/:443，终止 TLS
#   2. /portal/          → hermes-portal BFF（静态 + BFF API）
#   3. /api/portal/      → hermes-portal BFF（JWT 鉴权后代理下游）
#   4. /trader/...       → hermes-trader:8000（可选直连，调试用）
#
# SSE 流式接口必须关闭 proxy_buffering，并放行 chunked。
# 注意：map / upstream 等指令只能出现在 http {} 上下文。
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ── 压缩（2026-09-02 添加）──
    # 之前未开启，前端 JS/CSS 全部原样传输（实测 56,726 B 的 JS 零压缩，dist 共 1.1MB）。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml+rss
        application/vnd.ms-fontobject
        font/ttf
        font/opentype
        image/svg+xml;

    # WebSocket 升级映射（必须在 http 上下文）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream portal_backend {
        server hermes-portal:9000;
        keepalive 32;
    }

    upstream trader_backend {
        server hermes-trader:8000;
        keepalive 16;
    }

    # HTTP → HTTPS 跳转
    server {
        listen 80;
        server_name _;
        # 健康检查保留 HTTP
        location = /healthz { return 200 "ok\n"; }
        location / { return 301 https://$host$request_uri; }
    }

    # HTTPS 主入口
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # 证书（由 docker-compose 挂载；测试环境自签，生产请替换）
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 通用代理头
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # 2026-09-11 安全收紧（审计 Q1）：使用覆盖语义而非 $proxy_add_x_forwarded_for。
        # 追加语义会把客户端自带的伪造 XFF 放在链首，而 trader 的 _client_ip 与 BFF 的
        # client_info 都取 split(',')[0]；一旦 trader 误开 HERMES_TRUST_PROXY=1，攻击者
        # 即可用伪造首段 IP 轮换，绕过「5 次/5 分钟」失败锁定。本边缘是唯一一跳代理，
        # 直接以真实对端 $remote_addr 覆盖最安全（同时让 BFF 审计 IP 不可伪造）。
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # 上传体积（语音文件 ≤ 2MB，预留余量）
        client_max_body_size 8m;

        # ---------------- Portal 前端 + BFF ----------------
        location /portal/ {
            proxy_pass http://portal_backend;
            proxy_read_timeout 60s;
        }

        location /api/portal/ {
            proxy_pass http://portal_backend;
            proxy_read_timeout 300s;
        }

        # ---------------- Trader 直链（仅飞书复盘报告免登，白名单） ----------------
        # 2026-09-11 安全收紧（审计 Q2+Q3）：此处曾是 `location /trader/ { proxy_pass
        # http://trader_backend/; }` 去前缀通配，会把 trader 的全部路由（/metrics、
        # /postmortems、/api/**）暴露到 0.0.0.0:8443；而 trader 看到的来源恒为本机
        # nginx 容器私网 IP，其 require_operator_or_internal 的 RFC1918 豁免因此被
        # 等效绕过（任意可达 8443 者免 token 读到指标/复盘）。现改为白名单：仅放行
        # 飞书卡片"一键查看完整报告"所需的 postmortems 两条只读路径，其余 /trader/
        # 一律 404。注意保留尾部斜杠：/trader/postmortems/foo -> trader_backend/postmortems/foo。
        location = /trader/postmortems {
            proxy_pass http://trader_backend/postmortems;
            proxy_read_timeout 60s;
        }
        location ^~ /trader/postmortems/ {
            proxy_pass http://trader_backend/postmortems/;
            proxy_read_timeout 60s;
        }
        location ^~ /trader/ {
            # 白名单之外的 trader 直链（/trader/metrics、/trader/api/** 等）对公网关闭。
            return 404;
        }

        # ---------------- 旧运维台 SPA（hermes-web，--base=/web/）已归档 ----------------
        # 2026-09-01：hermes-web 零真实流量，功能已并入 hermes-portal（/portal/）。
        # 旧链接一律 301 到门户对应路径（/web/foo -> /portal/foo），保留书签可用性。
        # 回滚：恢复下方注释掉的反代块即可（静态源归档在 ~/archive/hermes-web-current）。
        location /web/ {
            return 301 /portal/$is_args$args;
        }
        # 归档前反代配置（回滚用）：
        # location /web/ {
        #     proxy_pass http://trader_backend;
        #     proxy_read_timeout 60s;
        # }

        # ---------------- Trader 裸路径直链（内网限定） ----------------
        # 2026-09-11 安全收紧（审计 Q2 剩余项）：这两条 location 绕过 BFF 直连 trader，
        # 而 trader 侧 public.py / shadow.py / audit.py 的只读端点是「匿名可达」设计，
        # 其 RBAC 前提是「由上游 portal BFF 的 _PATH_RULES 执行」。经 nginx 裸路径直连
        # 等于把 15 个匿名读端点（positions / equity-curve / closed-trades /
        # ledger/events / shadow/* 等）暴露到 0.0.0.0:8443。
        # 实测 7 天访问日志：裸路径仅 37 次，全部来自 192.168.124.x 与 docker 网关
        # 172.19.0.1（人工排障）；业务流量 156915 次全部走 /api/portal/（BFF）。
        # 故保留内网排障能力、关闭公网可达即可，无需删除 location。
        # 唯一消费裸路径的旧 SPA（hermes-web）已归档，其入口 /web/ 见上方 301。
        # 回滚：删除下方 allow/deny 块即恢复原行为。
        location /api/dashboard/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 100.64.0.0/10;   # Tailscale CGNAT
            deny  all;
            proxy_pass http://trader_backend;
            proxy_read_timeout 60s;
        }

        # SSE：运维台实时事件流（透传不缓冲）。同上内网限定：匿名可建立 24h 长连接，
        # 公网开放会形成连接耗尽面。Portal 前端的 SSE 走 /api/portal/trader/...，不受影响。
        location /api/feed/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 100.64.0.0/10;   # Tailscale CGNAT
            deny  all;
            proxy_pass http://trader_backend;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            add_header X-Accel-Buffering no always;
        }

        # BFF 自身健康检查（无鉴权）
        location = /api/health {
            proxy_pass http://portal_backend;
            access_log off;
        }

        # SSE 专用：交易实时流 / Agent 日志（透传不缓冲）
        location ~ ^/api/portal/trader/.*(stream|feed) {
            proxy_pass http://portal_backend;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            add_header X-Accel-Buffering no always;
        }

        # 根路径跳转
        location = / {
            return 302 /portal/;
        }

        # 健康检查
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
