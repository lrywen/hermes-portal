# =============================================================================
# Hermes Platform Nginx 反向代理
#
# 职责：
#   1. 统一入口 :80/:443，终止 TLS
#   2. /portal/          → hermes-portal BFF（静态 + BFF API）
#   3. /api/portal/      → hermes-portal BFF（JWT 鉴权后代理下游）
#   4. /trader/...       → hermes-trader:8000（可选直连，调试用）
#
# SSE 流式接口必须关闭 proxy_buffering，并放行 chunked。
# 注意：map / upstream 等指令只能出现在 http {} 上下文。
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # WebSocket 升级映射（必须在 http 上下文）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream portal_backend {
        server hermes-portal:9000;
        keepalive 32;
    }

    upstream trader_backend {
        server hermes-trader:8000;
        keepalive 16;
    }

    # HTTP → HTTPS 跳转
    server {
        listen 80;
        server_name _;
        # 健康检查保留 HTTP
        location = /healthz { return 200 "ok\n"; }
        location / { return 301 https://$host$request_uri; }
    }

    # HTTPS 主入口
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # 证书（由 docker-compose 挂载；测试环境自签，生产请替换）
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 通用代理头
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # 上传体积（语音文件 ≤ 2MB，预留余量）
        client_max_body_size 8m;

        # ---------------- Portal 前端 + BFF ----------------
        location /portal/ {
            proxy_pass http://portal_backend;
            proxy_read_timeout 60s;
        }

        location /api/portal/ {
            proxy_pass http://portal_backend;
            proxy_read_timeout 300s;
        }

        # ---------------- Trader 直链（飞书复盘报告等，无需登录） ----------------
        # 注意尾部斜杠：/trader/foo → trader_backend/foo（去掉 /trader 前缀）
        location /trader/ {
            proxy_pass http://trader_backend/;
            proxy_read_timeout 60s;
        }

        # ---------------- 旧运维台 SPA（hermes-web，--base=/web/）已归档 ----------------
        # 2026-09-01：hermes-web 零真实流量，功能已并入 hermes-portal（/portal/）。
        # 旧链接一律 301 到门户对应路径（/web/foo -> /portal/foo），保留书签可用性。
        # 回滚：恢复下方注释掉的反代块即可（静态源归档在 ~/archive/hermes-web-current）。
        location /web/ {
            return 301 /portal/$is_args$args;
        }
        # 归档前反代配置（回滚用）：
        # location /web/ {
        #     proxy_pass http://trader_backend;
        #     proxy_read_timeout 60s;
        # }

        location /api/dashboard/ {
            proxy_pass http://trader_backend;
            proxy_read_timeout 60s;
        }

        # SSE：运维台实时事件流（透传不缓冲）
        location /api/feed/ {
            proxy_pass http://trader_backend;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            add_header X-Accel-Buffering no always;
        }

        # BFF 自身健康检查（无鉴权）
        location = /api/health {
            proxy_pass http://portal_backend;
            access_log off;
        }

        # SSE 专用：交易实时流 / Agent 日志（透传不缓冲）
        location ~ ^/api/portal/trader/.*(stream|feed) {
            proxy_pass http://portal_backend;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            add_header X-Accel-Buffering no always;
        }

        # 根路径跳转
        location = / {
            return 302 /portal/;
        }

        # 健康检查
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
